[project]
name = "mcp-server"
version = "0.1.0"
description = "FastMCP server exposing shared tools (Snowflake DDL fetch, etc.) for Code Critic agents."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0",
    "common",
    "ruff>=0.15.12",
    "sqlfluff>=4.1.0",
]

[project.optional-dependencies]
snowflake = [
    "keyring>=25.0",
    "snowflake-snowpark-python>=1.0",
    "langchain-google-genai>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
