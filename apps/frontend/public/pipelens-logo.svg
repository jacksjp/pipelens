<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&amp;display=swap');</style>
    <linearGradient id="gaugeRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <radialGradient id="gaugeFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3f2fd" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="pipeH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="valve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="30" r="21" fill="url(#gaugeFace)"/>
  <circle cx="50" cy="30" r="21" fill="none" stroke="url(#gaugeRing)" stroke-width="5.5"/>

  <line x1="51" y1="31" x2="36.5" y2="22.5" stroke="#ef9a9a" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="50" cy="30" r="2.8" fill="#4fc3f7"/>

  <rect x="46.5" y="51" width="7" height="12" fill="url(#pipeH)" rx="1"/>
  <rect x="18" y="60" width="94" height="10" fill="url(#pipeH)" rx="2"/>

  <rect x="6" y="58" width="14" height="14" fill="url(#valve)" rx="1.5"/>
  <rect x="2" y="61" width="6" height="8" fill="url(#valve)" rx="1"/>
  <rect x="110" y="58" width="14" height="14" fill="url(#valve)" rx="1.5"/>
  <rect x="122" y="61" width="6" height="8" fill="url(#valve)" rx="1"/>

  <line x1="30" y1="72.5" x2="100" y2="72.5" stroke="#0288d1" stroke-width="0.8" opacity="0.5"/>
  <text x="46" y="84"
    font-family="'Rajdhani', 'Trebuchet MS', sans-serif"
    font-size="13" font-weight="700" letter-spacing="0.3"
    fill="#e0f7fa" text-anchor="middle">PIPE</text>
  <text x="87" y="84"
    font-family="'Rajdhani', 'Trebuchet MS', sans-serif"
    font-size="13" font-weight="400" letter-spacing="0.3"
    fill="#4fc3f7" text-anchor="middle">LENS</text>

</svg>
