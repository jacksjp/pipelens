# Local-development overrides: bind-mount source for hot reload.
# Picked up automatically by `docker compose up`.

services:

  orchestrator:
    command: ["sh", "-c", "uv run --package orchestrator uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./apps/orchestrator:/app/apps/orchestrator
      - ./packages/common:/app/packages/common

  mcp-server:
    volumes:
      - ./apps/mcp-server:/app/apps/mcp-server
      - ./packages/common:/app/packages/common

  agent-lint-auditor:
    volumes:
      - ./agents/lint-auditor:/app/agents/lint-auditor
      - ./packages/common:/app/packages/common
